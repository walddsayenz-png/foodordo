<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>foodordo — التسجيل وتسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1116; --bg2: #141822; --card: #191C24; --line: #2A2F3A;
    --text: #F3F5F8; --muted: #AEB6C3; --orange1: #FBA255; --orange2: #F0762E;
    --green1: #4ECB99; --green2: #2FB07F; --purple1: #9887FF; --purple2: #7A6BF5;
    --red: #FF6B6B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(130% 50% at 50% -10%, #1C2233 0%, var(--bg) 58%);
    color: var(--text); font-family: "Tajawal", system-ui, sans-serif;
    min-height: 100vh; padding: 40px 20px; display: flex; align-items: center; justify-content: center;
  }
  .wrap { width: 100%; max-width: 460px; margin: 0 auto; }
  .brand { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 36px; text-align: center; margin-bottom: 20px; }
  .brand .a { color: #fff; }
  .brand .b { background: linear-gradient(90deg, var(--green1), var(--purple1)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .tabs { display: flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 10px; border: 0; background: none; color: var(--muted); font-family: inherit; font-weight: 700; font-size: 14px; border-radius: 9px; cursor: pointer; transition: .2s; }
  .tab.active { background: var(--card); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .form-group { display: none; }
  .form-group.active { display: block; }
  label { display: block; font-weight: 700; font-size: 13px; margin: 12px 0 6px; color: #E6E9EF; }
  label:first-child { margin-top: 0; }
  input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; font-family: inherit; font-size: 14px; background: var(--bg2); color: #fff; }
  input:focus { outline: none; border-color: var(--purple1); box-shadow: 0 0 0 3px rgba(152,135,255,.12); }
  .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; transition: .2s; }
  .btn-google:hover { border-color: var(--purple1); background: var(--card); }
  .btn-google svg { width: 18px; height: 18px; }
  .divider { display: flex; align-items: center; margin: 18px 0; color: var(--muted); font-size: 12px; font-weight: 700; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .divider span { padding: 0 10px; }
  .cta { display: block; width: 100%; border: 0; cursor: pointer; padding: 15px; border-radius: 14px; font-family: inherit; font-weight: 800; font-size: 16px; color: #fff; background: linear-gradient(90deg, var(--orange2), var(--green2) 55%, var(--purple2)); margin-top: 20px; }
  .cta:disabled { opacity: .6; cursor: not-allowed; }
  .msg { display: none; font-weight: 700; font-size: 13px; padding: 12px; border-radius: 10px; margin-top: 15px; line-height: 1.6; text-align: center; }
  .msg.show { display: block; }
  .msg.ok { color: var(--green1); background: #12251C; border: 1px solid #1E4A32; }
  .msg.err { color: var(--red); background: #2A1618; border: 1px solid #4A2224; }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand"><span class="a">food</span><span class="b">ordo</span></div>

  <div class="card">
    <!-- التبديل بين الدخول والتسجيل -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('register')">إنشاء حساب جديد</button>
      <button class="tab" onclick="switchTab('login')">تسجيل الدخول</button>
    </div>

    <!-- زر Google OAuth -->
    <button type="button" class="btn-google" onclick="doGoogleLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      المتابعة بواسطة Google
    </button>

    <div class="divider"><span>أو بالبريد الإلكتروني</span></div>

    <!-- نموذج إنشاء حساب جديد -->
    <div id="registerForm" class="form-group active">
      <label>اسم المطعم</label>
      <input id="rName" placeholder="مثال: مطعم الذواقة" />
      
      <label>اسم المالك</label>
      <input id="rOwner" placeholder="اسمك الكامل" />
      
      <label>رقم الهاتف</label>
      <input id="rPhone" type="tel" placeholder="05xxxxxxxx" />
      
      <label>البريد الإلكتروني</label>
      <input id="rEmail" type="email" placeholder="you@example.com" />
      
      <label>كلمة السر</label>
      <input id="rPass" type="password" placeholder="8 أحرف على الأقل" />

      <button class="cta" id="regBtn" onclick="doRegister()">إنشاء حساب جديد (تجربة 3 أيام)</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div id="loginForm" class="form-group">
      <label>البريد الإلكتروني</label>
      <input id="lEmail" type="email" placeholder="you@example.com" />
      
      <label>كلمة السر</label>
      <input id="lPass" type="password" placeholder="كلمة السر" />

      <button class="cta" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
    </div>

    <div id="statusMsg" class="msg"></div>
  </div>
</div>

<script>
  var SUPABASE_URL = 'https://tflmkscxuvznpvidcgff.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_P210ESDiwZnLYYqTu4rc3A_s5C-xHuh';
  var AUTH = SUPABASE_URL + '/auth/v1/';
  var REST = SUPABASE_URL + '/rest/v1/';
  var MERCHANT = 'foodordo-merchant-connected.html';

  function H(x) {
    var h = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
    if (x) { for (var k in x) h[k] = x[k]; }
    return h;
  }

  function val(id) { return (document.getElementById(id).value || '').trim(); }
  
  function showMsg(txt, isOk) {
    var el = document.getElementById('statusMsg');
    el.textContent = txt;
    el.className = 'msg show ' + (isOk ? 'ok' : 'err');
  }

  function switchTab(type) {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.form-group').forEach(function(f){ f.classList.remove('active'); });
    document.getElementById('statusMsg').className = 'msg';

    if (type === 'register') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('registerForm').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('loginForm').classList.add('active');
    }
  }

  // الدخول بـ Google
  function doGoogleLogin() {
    var redir = window.location.href.split('#')[0].split('?')[0];
    window.location.href = AUTH + 'authorize?provider=google&redirect_to=' + encodeURIComponent(redir);
  }

  // إنشاء حساب عادي
  function doRegister() {
    var name = val('rName'), owner = val('rOwner'), phone = val('rPhone'), email = val('rEmail'), pass = val('rPass');
    if (!name || !owner || !phone || !email || !pass) { showMsg('يرجى ملء جميع الحقول المطلوب.'); return; }
    
    var btn = document.getElementById('regBtn');
    btn.disabled = true; btn.textContent = 'جارٍ إنشاء الحساب…';

    fetch(AUTH + 'signup', {
      method: 'POST',
      headers: H({'Content-Type': 'application/json'}),
      body: JSON.stringify({ email: email, password: pass })
    })
    .then(function(r) { return r.json().then(function(d){ if(!r.ok) throw new Error(d.msg || d.error_description || 'فشل التسجيل'); return d; }); })
    .then(function(auth) {
      var u = auth.user || auth;
      var token = auth.access_token;
      if (!token) throw new Error('يرجى مراجعة إعدادات تأكيد البريد الإلكتروني.');

      var endTrial = new Date();
      endTrial.setDate(endTrial.getDate() + 3);
      var trialISO = endTrial.toISOString().split('T')[0];

      return fetch(REST + 'restaurants', {
        method: 'POST',
        headers: H({'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}),
        body: JSON.stringify({
          restaurant_name: name, owner_name: owner, phone: phone,
          status: 'actif', is_trial: true, subscription_end: trialISO, user_id: u.id
        })
      });
    })
    .then(function() {
      showMsg('تم إنشاء حسابك بنجاح! يمكنك الآن تسجيل الدخول.', true);
      switchTab('login');
    })
    .catch(function(e) { showMsg(e.message || 'تعذر إنشاء الحساب.'); })
    .finally(function() { btn.disabled = false; btn.textContent = 'إنشاء حساب جديد (تجربة 3 أيام)'; });
  }

  // تسجيل الدخول العادي
  function doLogin() {
    var email = val('lEmail'), pass = val('lPass');
    if (!email || !pass) { showMsg('أدخل البريد وكلمة السر.'); return; }

    var btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الدخول…';

    fetch(AUTH + 'token?grant_type=password', {
      method: 'POST',
      headers: H({'Content-Type': 'application/json'}),
      body: JSON.stringify({ email: email, password: pass })
    })
    .then(function(r) { return r.json().then(function(d){ if(!r.ok) throw new Error('البريد أو كلمة السر غير صحيحة'); return d; }); })
    .then(function(sess) {
      var token = sess.access_token;
      return fetch(REST + 'restaurants?select=id,restaurant_name,status&user_id=eq.' + sess.user.id, {
        headers: H({'Authorization': 'Bearer ' + token})
      })
      .then(function(r){ return r.json(); })
      .then(function(rows) {
        if (!rows || !rows.length) throw new Error('لا يوجد مطعم مرتبط بهذا الحساب.');
        var rest = rows[0];
        try {
          localStorage.setItem('fo_token', token);
          localStorage.setItem('fo_rid', rest.id);
          localStorage.setItem('fo_rname', rest.restaurant_name || '');
        } catch(e) {}
        location.href = MERCHANT;
      });
    })
    .catch(function(e) { showMsg(e.message); })
    .finally(function() { btn.disabled = false; btn.textContent = 'تسجيل الدخول'; });
  }

  // معالجة العودة التلقائية من Google OAuth
  (functionCheckOAuth() {
    var hash = (location.hash || '').replace(/^#/, '');
    var params = {};
    hash.split('&').forEach(function(kv) {
      var p = kv.split('=');
      if (p[0]) params[p[0]] = decodeURIComponent(p[1] || '');
    });

    if (params.access_token) {
      var token = params.access_token;
      fetch(AUTH + 'user', { headers: H({'Authorization': 'Bearer ' + token}) })
      .then(function(r){ return r.json(); })
      .then(function(u) {
        if (!u || !u.id) return;
        return fetch(REST + 'restaurants?select=id,restaurant_name&user_id=eq.' + u.id, {
          headers: H({'Authorization': 'Bearer ' + token})
        })
        .then(function(r){ return r.json(); })
        .then(function(rows) {
          if (rows && rows.length > 0) {
            try {
              localStorage.setItem('fo_token', token);
              localStorage.setItem('fo_rid', rows[0].id);
              localStorage.setItem('fo_rname', rows[0].restaurant_name || '');
            } catch(e){}
            location.href = MERCHANT;
          } else {
            if (u.email) document.getElementById('rEmail').value = u.email;
            showMsg('تم تأكيد حساب Google ✓ يرجى إكمال اسم مطعمك وهاتفك للتسجيل.', true);
            switchTab('register');
          }
        });
      });
      try { history.replaceState(null, '', location.pathname); } catch(e) {}
    }
  })();
</script>
</body>
</html>
