ale(1.10)%22%3E%3Cg%3E%3Cpath%20d%3D%22M8%2026c0-9%208-16%2020-16s20%207%2020%2016z%22%20fill%3D%22%23FBA255%22%2F%3E%0A%3Ccircle%20cx%3D%2220%22%20cy%3D%2218%22%20r%3D%221.6%22%20fill%3D%22%230F1116%22%2F%3E%3Ccircle%20cx%3D%2228%22%20cy%3D%2215%22%20r%3D%221.6%22%20fill%3D%22%230F1116%22%2F%3E%3Ccircle%20cx%3D%2236%22%20cy%3D%2218%22%20r%3D%221.6%22%20fill%3D%22%230F1116%22%2F%3E%0A%3Crect%20x%3D%226%22%20y%3D%2226%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23F0762E%22%2F%3E%0A%3Cpath%20d%3D%22M6%2033c4%204%208-2%2012%202s8-2%2012%202%208-2%2012%202%206-2%206-2v3H6z%22%20fill%3D%22%234ECB99%22%2F%3E%0A%3Crect%20x%3D%226%22%20y%3D%2239%22%20width%3D%2244%22%20height%3D%227%22%20rx%3D%223.5%22%20fill%3D%22%23FBA255%22%2F%3E%0A%3Cpath%20d%3D%22M8%2046c0%205%206%208%2020%208s20-3%2020-8z%22%20fill%3D%22%23F0762E%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3Cg%20transform%3D%22translate(240%201500)%20rotate(9)%20scale(1.20)%22%3E%3Cg%3E%3Cpath%20d%3D%22M16%2030a10%2010%200%201%201%204-19%2011%2011%200%200%201%2020%200%2010%2010%200%201%201%204%2019z%22%20fill%3D%22%23FBA255%22%2F%3E%0A%3Crect%20x%3D%2216%22%20y%3D%2230%22%20width%3D%2228%22%20height%3D%2218%22%20rx%3D%223%22%20fill%3D%22%23F0762E%22%2F%3E%0A%3Cpath%20d%3D%22M22%2034v10M30%2034v10M38%2034v10%22%20stroke%3D%22%230F1116%22%20stroke-width%3D%221.6%22%20opacity%3D%22.45%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E"),radial-gradient(120% 40% at 50% -8%, var(--glow) 0%, var(--bg) 55%);background-repeat:repeat-y,no-repeat;background-size:400px auto,auto;background-position:center 0px,center top;background-color:var(--bg);min-height:100vh;padding-bottom:40px}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px;padding-left:52px}
  .brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:24px;letter-spacing:-1px;background:linear-gradient(90deg,#fff 45%,var(--green1) 70%,var(--purple1) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{font-size:12.5px;font-weight:800;color:var(--purple1);background:var(--prpbg);border:1px solid var(--prpline);padding:6px 12px;border-radius:999px}
  .h1{font-weight:800;font-size:21px;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:8px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
  .bar b{font-size:15px;font-weight:800;color:var(--ink)}
  .bar .r{display:flex;align-items:center;gap:10px}
  .bar span{font-size:12.5px;color:var(--muted);font-weight:700}
  .refresh{border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-family:inherit;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:10px;cursor:pointer}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:560px){.board{grid-template-columns:1fr}}
  .ticket{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column}
  .thead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .onum{width:52px;height:52px;flex:0 0 52px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,var(--purple1),var(--purple2));color:var(--ink);font-weight:800;font-size:22px;font-family:"Baloo 2",sans-serif}
  .thead .t b{display:block;font-size:16px;font-weight:800;color:var(--ink)}
  .thead .t span{font-size:12px;color:var(--muted);font-weight:600}
  .items{flex:1;border-top:1px solid var(--hair);padding-top:10px;display:grid;gap:9px;margin-bottom:12px}
  .it{display:flex;gap:10px;align-items:baseline}
  .it .q{flex:0 0 auto;min-width:34px;height:26px;padding:0 8px;border-radius:8px;background:var(--prpbg);color:var(--purple1);font-weight:800;font-size:14px;display:grid;place-items:center}
  .it .nm{flex:1}
  .it .nm b{font-size:15px;font-weight:800;color:var(--ink)}
  .it .nm small{display:block;color:var(--amber);font-size:12.5px;font-weight:700;margin-top:2px}
  .done{border:0;cursor:pointer;padding:13px;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;color:var(--ink);background:linear-gradient(90deg,var(--green2),var(--purple2))}
  .done:disabled{opacity:.6}
  .done:active{transform:translateY(1px)}
  .empty{text-align:center;color:var(--dim);font-weight:600;padding:40px 0;font-size:15px;grid-column:1/-1}
  .err{display:none;text-align:center;color:var(--red);background:var(--redbg);border:1px solid var(--redline);border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;grid-column:1/-1}
  .err.show{display:block}
  .gate{max-width:460px;margin:80px auto;text-align:center;padding:0 22px}
  .themebtn{position:fixed;top:12px;left:12px;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .themebtn svg{width:19px;height:19px;fill:currentColor}
  .outbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--outline);background:var(--outbg);color:var(--outtx);cursor:pointer;display:grid;place-items:center;flex:0 0 auto;padding:0}
  .outbtn svg{width:18px;height:18px;fill:currentColor}

  /* ــ طبقة دلالية: قيمها هنا مطابقة تماماً للمظهر الليلي الحالي ــ */
  :root{

  var AUTH=SUPABASE_URL+'/auth/v1/';
  var TOKEN=null;
  try{ TOKEN=localStorage.getItem('fo_token'); }catch(e){}
  function H(x){ var h={apikey:SUPABASE_KEY,Authorization:'Bearer '+(TOKEN||SUPABASE_KEY)}; if(x){for(var k in x)h[k]=x[k];} return h; }
  function onAuthFail(r,t){ if(r.status===401 || (t&&(t.indexOf('JWT expired')>-1||t.indexOf('PGRST303')>-1))){ refreshNow().then(function(ok){ if(ok){ location.reload(); } else { logout(); } }); return true; } return false; }
  function gGet(p){ return fetch(REST+p,{headers:H()}).then(function(r){ if(!r.ok)return r.text().then(function(t){ onAuthFail(r,t); throw new Error(t)}); return r.json(); }); }
  function gPatch(p,b){ return fetch(REST+p,{method:'PATCH',headers:H({'Content-Type':'application/json','Prefer':'return=minimal'}),body:JSON.stringify(b)}).then(function(r){ if(!r.ok)return r.text().then(function(t){ onAuthFail(r,t); throw new Error(t)}); }); }

  var RID=null, RNAME='';
  try{ RID=localStorage.getItem('fo_rid'); RNAME=localStorage.getItem('fo_rname')||''; }catch(e){}
  var orders=[];
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function timeOf(ts){ if(!ts)return ''; var d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  function doGateLogin(){
    var email=(document.getElementById('gEmail').value||'').trim(), pass=(document.getElementById('gPass').value||'');
    var em=document.getElementById('gMsg');
    if(!email||!pass){ em.textContent='أدخل البريد وكلمة السر.'; em.style.display='block'; return; }
    var b=document.getElementById('gBtn'); b.disabled=true; b.textContent='جارٍ الدخول…';
    fetch(AUTH+'token?grant_type=password',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({email:email,password:pass})})
      .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error_description||d.msg||'بيانات الدخول غير صحيحة'); return d; }); })
      .then(function(sess){
        var tok=sess.access_token;
        return fetch(REST+'restaurants?select=id,restaurant_name,status,subscription_end&or=(user_id.eq.'+sess.user.id+',staff_user_id.eq.'+sess.user.id+')',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok}})
          .then(function(r){return r.json();})
          .then(function(rows){
            if(!rows||!rows.length) throw new Error('لا يوجد مطعم مرتبط بهذا الحساب.');
            if(rows[0].status!=='actif') throw new Error('حساب المطعم غير مفعّل بعد.');
            if(rows[0].subscription_end && rows[0].subscription_end < iso(new Date())) throw new Error('انتهى اشتراك المطعم. يرجى التجديد.');
            TOKEN=tok; RID=rows[0].id; RNAME=rows[0].restaurant_name||'';
            try{ localStorage.setItem('fo_token',tok); localStorage.setItem('fo_refresh',sess.refresh_token||''); localStorage.setItem('fo_rid',RID); localStorage.setItem('fo_rname',RNAME); }catch(e){}
            document.getElementById('gate').style.display='none'; boot();
          });
      })
      .catch(function(e){ var m=safeErr(e)+''; if(m.indexOf('nvalid')>-1) m='البريد أو كلمة السر غير صحيحة.'; em.textContent=m; em.style.display='block'; })
      .finally(function(){ b.disabled=false; b.textContent='دخول'; });
  }
  function logout(){ try{ localStorage.removeItem('fo_token'); localStorage.removeItem('fo_rid'); localStorage.removeItem('fo_rname'); }catch(e){} location.reload(); }

  function refreshNow(){
    var rt=null; try{ rt=localStorage.getItem('fo_refresh'); }catch(e){}
    if(!rt) return Promise.resolve(false);
    return fetch(AUTH+'token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})})
      .then(function(r){ if(!r.ok) return false; return r.json().then(function(d){ if(d.access_token){ TOKEN=d.access_token; try{ localStorage.setItem('fo_token',d.access_token); if(d.refresh_token)localStorage.setItem('fo_refresh',d.refresh_token); }catch(e){} return true; } return false; }); })
      .catch(function(){ return false; });
  }
  function checkSubscription(){
    return gGet('restaurants?select=status,subscription_end&id=eq.'+RID).then(function(r){
      if(!r||!r[0]) return true;
      var rest=r[0];
      var t=iso(new Date());
      if(rest.status!=='actif' || (rest.subscription_end && rest.subscription_end < t)){
        try{ localStorage.removeItem('fo_token'); localStorage.removeItem('fo_refresh'); localStorage.removeItem('fo_rid'); localStorage.removeItem('fo_rname'); }catch(e){}
        document.body.innerHTML='<div style="max-width:460px;margin:80px auto;padding:0 22px;text-align:center;font-family:inherit">'+
          '<div style="font-family:Baloo 2,sans-serif;font-weight:800;font-size:32px;color:var(--ink)">food<span style="background:linear-gradient(90deg,#4ECB99,#9887FF);-webkit-background-clip:text;background-clip:text;color:transparent">ordo</span></div>'+
          '<h2 style="color:var(--ink);font-size:22px;margin:22px 0 10px">انتهى اشتراك المطعم</h2>'+
          '<p style="color:#AEB6C3;font-size:14.5px;line-height:1.9">أُغلقت الجلسة تلقائياً. يرجى إبلاغ صاحب المطعم لتجديد الاشتراك. كل البيانات محفوظة.</p>'+
          '</div>';
        return false;
      }
      return true;
    }).catch(function(){ return true; });
  }
  function boot(){
    if(!TOKEN||!RID){ document.getElementById('gate').style.display='block'; return; }
    document.getElementById('app').style.display='block';
    document.getElementById('roleTag').textContent = RNAME ? ('المطبخ · '+RNAME) : 'المطبخ';
    refreshNow();
    setInterval(refreshNow, 40*60*1000);
    checkSubscription();
    setInterval(checkSubscription, 40*60*1000);
    load();
  }
  function load(){
    var today=iso(new Date());
    gGet('orders?select=id,order_number,created_at,order_items(product_name,quantity,sauces)&restaurant_id=eq.'+RID+'&order_date=eq.'+today+'&status=eq.paid&order=order_number.asc')
      .then(function(rows){ orders=rows||[]; render(); })
      .catch(function(e){ document.getElementById('board').innerHTML='<div class="err show">تعذّر التحميل: '+safeErr(e)+'</div>'; });
  }
  function render(){
    document.getElementById('cnt').textContent=orders.length+' طلب';
    var el=document.getElementById('board');
    if(!orders.length){ el.innerHTML='<div class="empty">لا توجد طلبات قيد التحضير الآن.</div>'; return; }
    el.innerHTML=orders.map(function(o){
      var items=(o.order_items||[]).map(function(i){
        return '<div class="it"><span class="q">×'+i.quantity+'</span><div class="nm"><b>'+esc(i.product_name)+'</b>'+(i.sauces?('<small>صلصات: '+esc(i.sauces)+'</small>'):'')+'</div></div>';
      }).join('');
      return '<div class="ticket"><div class="thead"><div class="onum">'+o.order_number+'</div><div class="t"><b>طلب رقم '+o.order_number+'</b><span>الساعة '+timeOf(o.created_at)+'</span></div></div>'+
        '<div class="items">'+items+'</div><button class="done" onclick="deliver(\''+o.id+'\',this)">تم التسليم ✓</button></div>';
    }).join('');
  }
  function deliver(id,btn){
    btn.disabled=true; btn.textContent='جارٍ…';
    gPatch('orders?id=eq.'+id, {status:'delivered'})
      .then(function(){ orders=orders.filter(function(o){return o.id!==id;}); render(); })
      .catch(function(e){ btn.disabled=false; btn.textContent='تم التسليم ✓'; alert && null; document.getElementById('board').insertAdjacentHTML('afterbegin','<div class="err show">تعذّر التحديث: '+safeErr(e)+'</div>'); });
  }

  boot();
</script>
<script>
  /* الخلفية تتحرّك أبطأ من المحتوى فتبدو كصورة طويلة خلف الصفحة */
  (function(){
    var q=false;
    function upd(){ q=false;
      var y=Math.round((window.pageYOffset||document.documentElement.scrollTop||0)*-0.35);
      document.body.style.backgroundPositionY = y+'px, 0px';
    }
    window.addEventListener('scroll', function(){ if(!q){ q=true; requestAnimationFrame(upd); } }, {passive:true});
    window.addEventListener('resize', upd, {passive:true});
    upd();
  })();
</script>
</body>
</html>
