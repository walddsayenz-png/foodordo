<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>foodordo — المطبخ</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0F1116;--bg2:#141822;--card:#191C24;--line:#2A2F3A;--text:#F3F5F8;--muted:#AEB6C3;
        --orange1:#FBA255;--orange2:#F0762E;--green1:#4ECB99;--green2:#2FB07F;--purple1:#9887FF;--purple2:#7A6BF5;--blue1:#5C9BFF;--blue2:#3D74E6;--amber:#F3C969;--red:#FF6B6B;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"Tajawal",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(120% 40% at 50% -8%, #1B2130 0%, var(--bg) 55%);min-height:100vh;padding-bottom:40px}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
  .brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:24px;letter-spacing:-1px;background:linear-gradient(90deg,#fff 45%,var(--green1) 70%,var(--purple1) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{font-size:12.5px;font-weight:800;color:var(--purple1);background:#20213A;border:1px solid #3A2E52;padding:6px 12px;border-radius:999px}
  .h1{font-weight:800;font-size:21px;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:8px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
  .bar b{font-size:15px;font-weight:800;color:#fff}
  .bar .r{display:flex;align-items:center;gap:10px}
  .bar span{font-size:12.5px;color:var(--muted);font-weight:700}
  .refresh{border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-family:inherit;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:10px;cursor:pointer}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:560px){.board{grid-template-columns:1fr}}
  .ticket{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column}
  .thead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .onum{width:52px;height:52px;flex:0 0 52px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,var(--purple1),var(--purple2));color:#fff;font-weight:800;font-size:22px;font-family:"Baloo 2",sans-serif}
  .thead .t b{display:block;font-size:16px;font-weight:800;color:#fff}
  .thead .t span{font-size:12px;color:var(--muted);font-weight:600}
  .items{flex:1;border-top:1px solid #20242E;padding-top:10px;display:grid;gap:9px;margin-bottom:12px}
  .it{display:flex;gap:10px;align-items:baseline}
  .it .q{flex:0 0 auto;min-width:34px;height:26px;padding:0 8px;border-radius:8px;background:#20213A;color:var(--purple1);font-weight:800;font-size:14px;display:grid;place-items:center}
  .it .nm{flex:1}
  .it .nm b{font-size:15px;font-weight:800;color:#fff}
  .it .nm small{display:block;color:var(--amber);font-size:12.5px;font-weight:700;margin-top:2px}
  .done{border:0;cursor:pointer;padding:13px;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--green2),var(--purple2))}
  .done:disabled{opacity:.6}
  .done:active{transform:translateY(1px)}
  .empty{text-align:center;color:#6C7484;font-weight:600;padding:40px 0;font-size:15px;grid-column:1/-1}
  .err{display:none;text-align:center;color:var(--red);background:#2A1618;border:1px solid #4A2224;border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;grid-column:1/-1}
  .err.show{display:block}
  .gate{max-width:460px;margin:80px auto;text-align:center;padding:0 22px}
</style>
<script>
  // حماية من Clickjacking — بلا كسر المتصفّحات المدمجة (واتساب/فيسبوك/المعاينة)
  // نحاول الخروج من الإطار فقط، ولا نمسح الصفحة أبداً إن تعذّر ذلك.
  (function(){
    try{
      if (window.top !== window.self && window.top.location.origin !== window.self.location.origin) {
        window.top.location = window.self.location.href;
      }
    }catch(e){ /* متصفّح مدمج أو منع أمني — نتجاهل بلا تعطيل الصفحة */ }
  })();
</script>
</head>
<body>

<div id="gate" class="gate" style="display:none">
  <div class="brand" style="font-size:30px">foodordo</div>
  <h2 class="h1" style="text-align:center;margin-top:16px">دخول المطبخ</h2>
  <p class="sub" style="text-align:center">سجّل الدخول بحساب المطعم لعرض الطلبات.</p>
  <div style="background:#191C24;border:1px solid #2A2F3A;border-radius:18px;padding:20px;margin-top:8px;max-width:420px;margin-left:auto;margin-right:auto">
    <label style="display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:#E6E9EF">البريد الإلكتروني</label>
    <input id="gEmail" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" style="width:100%;padding:13px;border:1px solid #2A2F3A;border-radius:11px;font-family:inherit;font-size:15px;background:#141822;color:#fff" />
    <label style="display:block;font-weight:700;font-size:13px;margin:12px 0 6px;color:#E6E9EF">كلمة السر</label>
    <input id="gPass" type="password" autocomplete="current-password" placeholder="كلمة السر" style="width:100%;padding:13px;border:1px solid #2A2F3A;border-radius:11px;font-family:inherit;font-size:15px;background:#141822;color:#fff" />
    <button id="gBtn" onclick="doGateLogin()" style="display:block;width:100%;margin-top:18px;border:0;cursor:pointer;padding:14px;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(90deg,#7A6BF5,#2FB07F)">دخول</button>
    <div id="gMsg" style="display:none;font-weight:700;font-size:13px;padding:10px 12px;border-radius:11px;margin-top:12px;color:#FF6B6B;background:#2A1618;border:1px solid #4A2224"></div>
  </div>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="top"><div class="brand">foodordo</div><div style="display:flex;gap:8px;align-items:center"><button onclick="logout()" style="background:#2A1618;border:1px solid #4A2224;color:#FF8A8A;font-family:inherit;font-weight:800;font-size:12px;padding:7px 13px;border-radius:999px;cursor:pointer">خروج</button><div class="role" id="roleTag">المطبخ</div></div></div>
  <div class="h1">شاشة المطبخ</div>
  <div class="sub">الطلبات المدفوعة جاهزة للتحضير. اضغط "تم التسليم" عند جهوز الطلب.</div>
  <div class="bar"><b>قيد التحضير</b><div class="r"><span id="cnt">0 طلب</span><button class="refresh" onclick="load()">تحديث ↻</button></div></div>
  <div class="board" id="board"><div class="empty">جارٍ التحميل…</div></div>
</div>

<script>
  var DEBUG_ERR = (location.search||'').indexOf('debug=1') > -1;
  // ===== حماية من XSS: تهريب أي نصّ قادم من المستخدم قبل عرضه =====
  // ===== رسائل أخطاء آمنة: لا نكشف تفاصيل قاعدة البيانات للمستخدم =====
  function safeErr(e){
    var m = String((e && e.message) || e || '');
    // وضع التشخيص: أضف ?debug=1 إلى الرابط لرؤية الخطأ التقني كاملاً
    if(DEBUG_ERR) return 'خطأ تقني: ' + m.slice(0,400);
    if(!m) return 'تعذّر إتمام العملية — لم يردّ الخادم برسالة.';
    // رسائلنا العربية تمرّ كما هي — لا تُخفى خلف رسالة عامة
    if(/[\u0600-\u06FF]/.test(m)) return m;
    if(m.indexOf('rate limit')>-1)          return 'الخدمة مزدحمة حالياً، حاول بعد لحظات.';
    if(m.indexOf('insufficient stock:')>-1) return 'نفد المخزون من: ' + esc(m.split('insufficient stock:')[1].split('"')[0].replace(/[}\\]/g,'').trim());
    if(m.indexOf('daily limit')>-1)         return 'اكتمل الحدّ الأقصى للطلبات اليوم.';
    if(m.indexOf('invalid product')>-1)     return 'أحد المنتجات لم يعد متاحاً. حدّث القائمة.';
    if(m.indexOf('empty order')>-1)         return 'الطلب فارغ.';
    if(m.indexOf('does not belong')>-1)     return 'هذا الطلب لا يخصّ مطعمك.';
    if(m.indexOf('materials_qty_non_negative')>-1) return 'الكمية غير كافية في المخزون.';
    if(m.indexOf('chk_')>-1 || m.indexOf('char_length')>-1) return 'أحد الحقول أطول من المسموح. اختصره.';
    if(m.indexOf('duplicate key')>-1)       return 'هذا العنصر مسجّل مسبقاً.';
    if(m.indexOf('violates foreign key')>-1)return 'لا يمكن تنفيذ العملية — العنصر مرتبط ببيانات أخرى.';
    if(m.indexOf('row-level security')>-1 || m.indexOf('permission denied')>-1) return 'لا تملك صلاحية هذه العملية.';
    if(m.indexOf('JWT')>-1 || m.indexOf('PGRST303')>-1) return 'انتهت الجلسة، سجّل الدخول من جديد.';
    if(m.indexOf('Failed to fetch')>-1 || m.indexOf('NetworkError')>-1) return 'تعذّر الاتصال — تحقّق من الإنترنت.';
    // خطأ غير معروف: نستخرج رمزه (غير حسّاس) لتسهيل التشخيص بدل إخفائه تماماً
    var code='';
    var mm = m.match(/"code"\s*:\s*"([^"]+)"/);
    if(mm) code = mm[1];
    var byCode = {
      '42501':'لا تملك صلاحية هذه العملية.',
      '42P01':'جدول غير موجود في الخادم.',
      '42883':'دالة غير موجودة في الخادم.',
      '23503':'لا يمكن تنفيذ العملية — العنصر مرتبط ببيانات أخرى.',
      '23505':'هذا العنصر مسجّل مسبقاً.',
      '23514':'إحدى القيم غير مقبولة.',
      '22P02':'إحدى القيم بصيغة غير صحيحة.',
      'PGRST202':'هذه العملية غير متاحة في الخادم (دالة ناقصة).',
      'PGRST204':'حقل غير موجود في الخادم — حدّث الصفحة.',
      'PGRST301':'انتهت الجلسة، سجّل الدخول من جديد.'
    };
    if(byCode[code]) return byCode[code];
    return 'تعذّر إتمام العملية.' + (code ? ' (رمز: ' + code + ')' : '');
  }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var SUPABASE_URL='https://tflmkscxuvznpvidcgff.supabase.co';
  var SUPABASE_KEY='sb_publishable_P210ESDiwZnLYYqTu4rc3A_s5C-xHuh';
  var REST=SUPABASE_URL+'/rest/v1/';
  var AUTH=SUPABASE_URL+'/auth/v1/';
  var TOKEN=null;
  try{ TOKEN=localStorage.getItem('fo_token'); }catch(e){}
  function H(x){ var h={apikey:SUPABASE_KEY,Authorization:'Bearer '+(TOKEN||SUPABASE_KEY)}; if(x){for(var k in x)h[k]=x[k];} return h; }
  function onAuthFail(r,t){ if(r.status===401 || (t&&(t.indexOf('JWT expired')>-1||t.indexOf('PGRST303')>-1))){ refreshNow().then(function(ok){ if(ok){ location.reload(); } else { logout(); } }); return true; } return false; }
  function gGet(p){ return fetch(REST+p,{headers:H()}).then(function(r){ if(!r.ok)return r.text().then(function(t){ onAuthFail(r,t); throw new Error(t)}); return r.json(); }); }
  function gPatch(p,b){ return fetch(REST+p,{method:'PATCH',headers:H({'Content-Type':'application/json','Prefer':'return=minimal'}),body:JSON.stringify(b)}).then(function(r){ if(!r.ok)return r.text().then(function(t){ onAuthFail(r,t); throw new Error(t)}); }); }

  var RID=null, RNAME='';
  try{ RID=localStorage.getItem('fo_rid'); RNAME=localStorage.getItem('fo_rname')||''; }catch(e){}
  var orders=[];
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function timeOf(ts){ if(!ts)return ''; var d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  function doGateLogin(){
    var email=(document.getElementById('gEmail').value||'').trim(), pass=(document.getElementById('gPass').value||'');
    var em=document.getElementById('gMsg');
    if(!email||!pass){ em.textContent='أدخل البريد وكلمة السر.'; em.style.display='block'; return; }
    var b=document.getElementById('gBtn'); b.disabled=true; b.textContent='جارٍ الدخول…';
    fetch(AUTH+'token?grant_type=password',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({email:email,password:pass})})
      .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error_description||d.msg||'بيانات الدخول غير صحيحة'); return d; }); })
      .then(function(sess){
        var tok=sess.access_token;
        return fetch(REST+'restaurants?select=id,restaurant_name,status,subscription_end&or=(user_id.eq.'+sess.user.id+',staff_user_id.eq.'+sess.user.id+')',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok}})
          .then(function(r){return r.json();})
          .then(function(rows){
            if(!rows||!rows.length) throw new Error('لا يوجد مطعم مرتبط بهذا الحساب.');
            if(rows[0].status!=='actif') throw new Error('حساب المطعم غير مفعّل بعد.');
            if(rows[0].subscription_end && rows[0].subscription_end < iso(new Date())) throw new Error('انتهى اشتراك المطعم. يرجى التجديد.');
            TOKEN=tok; RID=rows[0].id; RNAME=rows[0].restaurant_name||'';
            try{ localStorage.setItem('fo_token',tok); localStorage.setItem('fo_refresh',sess.refresh_token||''); localStorage.setItem('fo_rid',RID); localStorage.setItem('fo_rname',RNAME); }catch(e){}
            document.getElementById('gate').style.display='none'; boot();
          });
      })
      .catch(function(e){ var m=safeErr(e)+''; if(m.indexOf('nvalid')>-1) m='البريد أو كلمة السر غير صحيحة.'; em.textContent=m; em.style.display='block'; })
      .finally(function(){ b.disabled=false; b.textContent='دخول'; });
  }
  function logout(){ try{ localStorage.removeItem('fo_token'); localStorage.removeItem('fo_rid'); localStorage.removeItem('fo_rname'); }catch(e){} location.reload(); }

  function refreshNow(){
    var rt=null; try{ rt=localStorage.getItem('fo_refresh'); }catch(e){}
    if(!rt) return Promise.resolve(false);
    return fetch(AUTH+'token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})})
      .then(function(r){ if(!r.ok) return false; return r.json().then(function(d){ if(d.access_token){ TOKEN=d.access_token; try{ localStorage.setItem('fo_token',d.access_token); if(d.refresh_token)localStorage.setItem('fo_refresh',d.refresh_token); }catch(e){} return true; } return false; }); })
      .catch(function(){ return false; });
  }
  function checkSubscription(){
    return gGet('restaurants?select=status,subscription_end&id=eq.'+RID).then(function(r){
      if(!r||!r[0]) return true;
      var rest=r[0];
      var t=iso(new Date());
      if(rest.status!=='actif' || (rest.subscription_end && rest.subscription_end < t)){
        try{ localStorage.removeItem('fo_token'); localStorage.removeItem('fo_refresh'); localStorage.removeItem('fo_rid'); localStorage.removeItem('fo_rname'); }catch(e){}
        document.body.innerHTML='<div style="max-width:460px;margin:80px auto;padding:0 22px;text-align:center;font-family:inherit">'+
          '<div style="font-family:Baloo 2,sans-serif;font-weight:800;font-size:32px;color:#fff">food<span style="background:linear-gradient(90deg,#4ECB99,#9887FF);-webkit-background-clip:text;background-clip:text;color:transparent">ordo</span></div>'+
          '<h2 style="color:#fff;font-size:22px;margin:22px 0 10px">انتهى اشتراك المطعم</h2>'+
          '<p style="color:#AEB6C3;font-size:14.5px;line-height:1.9">أُغلقت الجلسة تلقائياً. يرجى إبلاغ صاحب المطعم لتجديد الاشتراك. كل البيانات محفوظة.</p>'+
          '</div>';
        return false;
      }
      return true;
    }).catch(function(){ return true; });
  }
  function boot(){
    if(!TOKEN||!RID){ document.getElementById('gate').style.display='block'; return; }
    document.getElementById('app').style.display='block';
    document.getElementById('roleTag').textContent = RNAME ? ('المطبخ · '+RNAME) : 'المطبخ';
    refreshNow();
    setInterval(refreshNow, 40*60*1000);
    checkSubscription();
    setInterval(checkSubscription, 40*60*1000);
    load();
  }
  function load(){
    var today=iso(new Date());
    gGet('orders?select=id,order_number,created_at,order_items(product_name,quantity,sauces)&restaurant_id=eq.'+RID+'&order_date=eq.'+today+'&status=eq.paid&order=order_number.asc')
      .then(function(rows){ orders=rows||[]; render(); })
      .catch(function(e){ document.getElementById('board').innerHTML='<div class="err show">تعذّر التحميل: '+safeErr(e)+'</div>'; });
  }
  function render(){
    document.getElementById('cnt').textContent=orders.length+' طلب';
    var el=document.getElementById('board');
    if(!orders.length){ el.innerHTML='<div class="empty">لا توجد طلبات قيد التحضير الآن.</div>'; return; }
    el.innerHTML=orders.map(function(o){
      var items=(o.order_items||[]).map(function(i){
        return '<div class="it"><span class="q">×'+i.quantity+'</span><div class="nm"><b>'+esc(i.product_name)+'</b>'+(i.sauces?('<small>صلصات: '+esc(i.sauces)+'</small>'):'')+'</div></div>';
      }).join('');
      return '<div class="ticket"><div class="thead"><div class="onum">'+o.order_number+'</div><div class="t"><b>طلب رقم '+o.order_number+'</b><span>الساعة '+timeOf(o.created_at)+'</span></div></div>'+
        '<div class="items">'+items+'</div><button class="done" onclick="deliver(\''+o.id+'\',this)">تم التسليم ✓</button></div>';
    }).join('');
  }
  function deliver(id,btn){
    btn.disabled=true; btn.textContent='جارٍ…';
    gPatch('orders?id=eq.'+id, {status:'delivered'})
      .then(function(){ orders=orders.filter(function(o){return o.id!==id;}); render(); })
      .catch(function(e){ btn.disabled=false; btn.textContent='تم التسليم ✓'; alert && null; document.getElementById('board').insertAdjacentHTML('afterbegin','<div class="err show">تعذّر التحديث: '+safeErr(e)+'</div>'); });
  }

  boot();
</script>
</body>
</html>
