<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>foodordo — الكاشير</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0F1116;--bg2:#141822;--card:#191C24;--line:#2A2F3A;--text:#F3F5F8;--muted:#AEB6C3;
        --orange1:#FBA255;--orange2:#F0762E;--green1:#4ECB99;--green2:#2FB07F;--purple1:#9887FF;--purple2:#7A6BF5;--blue1:#5C9BFF;--blue2:#3D74E6;--amber:#F3C969;--red:#FF6B6B;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"Tajawal",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(120% 40% at 50% -8%, #1B2130 0%, var(--bg) 55%);min-height:100vh;padding-bottom:40px}
  .wrap{max-width:600px;margin:0 auto;padding:0 18px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
  .brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:24px;letter-spacing:-1px;background:linear-gradient(90deg,#fff 45%,var(--green1) 70%,var(--purple1) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{font-size:12.5px;font-weight:800;color:var(--green1);background:#12251C;border:1px solid #1E4A32;padding:6px 12px;border-radius:999px}
  .h1{font-weight:800;font-size:21px;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:16px}
  .search{display:flex;gap:9px;margin-bottom:16px}
  .search input{flex:1;padding:14px;border:1px solid var(--line);border-radius:13px;font-family:inherit;font-size:18px;font-weight:800;background:var(--bg2);color:#fff;text-align:center}
  .search input:focus{outline:none;border-color:var(--green2)}
  .search button{border:0;cursor:pointer;background:linear-gradient(90deg,var(--green2),var(--purple2));color:#fff;font-family:inherit;font-weight:800;font-size:15px;padding:0 18px;border-radius:13px}
  .sech{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
  .sech b{font-size:15px;font-weight:800;color:#fff}
  .sech span{font-size:12.5px;color:var(--muted);font-weight:700}
  .refresh{border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-family:inherit;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:10px;cursor:pointer}
  .ocard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;cursor:pointer;transition:.15s}
  .ocard:active{transform:scale(.99)}
  .ocard.hit{border-color:var(--green2);box-shadow:0 0 0 2px rgba(47,176,127,.25)}
  .onum{width:54px;height:54px;flex:0 0 54px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,var(--orange1),var(--orange2));color:#fff;font-weight:800;font-size:22px;font-family:"Baloo 2",sans-serif}
  .oinfo{flex:1}
  .oinfo b{display:block;font-size:15px;font-weight:800;color:#fff}
  .oinfo span{font-size:12.5px;color:var(--muted);font-weight:600}
  .otot{font-weight:800;font-size:16px;color:var(--green1);white-space:nowrap}
  .empty{text-align:center;color:#6C7484;font-weight:600;padding:26px 0;font-size:14px}
  .modal{position:fixed;inset:0;background:rgba(6,8,12,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:600px;padding:20px 18px 26px;animation:up .25s both}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .sheet .hh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .sheet .onum{width:60px;height:60px;flex:0 0 60px;font-size:24px}
  .sheet .hh .t b{display:block;font-size:19px;font-weight:800;color:#fff}
  .sheet .hh .t span{font-size:13px;color:var(--muted);font-weight:600}
  .li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #20242E;font-size:14.5px}
  .li .n{color:#E6E9EF;font-weight:700}
  .li .n small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
  .li .p{color:#fff;font-weight:800;white-space:nowrap}
  .totrow{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px}
  .totrow .k{color:var(--muted);font-weight:700;font-size:15px}
  .totrow .v{color:var(--green1);font-weight:800;font-size:26px}
  .cta{display:block;width:100%;border:0;cursor:pointer;padding:16px;border-radius:14px;font-family:inherit;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--green2),var(--purple2));margin-top:8px}
  .cta:disabled{opacity:.6}
  .cta:active{transform:translateY(1px)}
  .ghost{display:block;width:100%;padding:13px;border-radius:14px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:9px}
  .dmsg{display:none;font-weight:700;font-size:13px;padding:10px 12px;border-radius:11px;margin-top:10px}
  .dmsg.show{display:block}
  .dmsg.err{color:var(--red);background:#2A1618;border:1px solid #4A2224}
  .paidmsg{display:none;text-align:center;padding:12px 0 2px}
  .paidmsg.show{display:block}
  .paidmsg .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(150deg,var(--green1),var(--green2))}
  .paidmsg .ic svg{width:32px;height:32px;fill:#fff}
  .paidmsg b{font-size:18px;font-weight:800;color:#fff;display:block}
  .paidmsg span{font-size:13.5px;color:var(--muted);font-weight:600}
  .gate{max-width:460px;margin:80px auto;text-align:center;padding:0 22px}
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none">
  <div class="brand" style="font-size:30px">foodordo</div>
  <h2 class="h1" style="text-align:center;margin-top:16px">شاشة الكاشير</h2>
  <p class="sub" style="text-align:center">تُفتح على جهاز الكاشير عبر رابط يحمل معرّف المطعم. لا يوجد معرّف في الرابط.</p>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="top"><div class="brand">foodordo</div><div class="role" id="roleTag">الكاشير</div></div>
  <div class="h1">استلام الطلبات</div>
  <div class="sub">ابحث برقم الطلب، أو اختره من قائمة اليوم.</div>

  <div class="search">
    <input id="q" type="number" inputmode="numeric" placeholder="رقم الطلب" oninput="filterList()" />
    <button onclick="filterList()">بحث</button>
  </div>

  <div class="sech"><b>طلبات اليوم غير المدفوعة</b><span><span id="cnt">0</span> طلب <button class="refresh" onclick="loadOrders()">تحديث ↻</button></span></div>
  <div id="list"><div class="empty">جارٍ التحميل…</div></div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div id="detailBody">
      <div class="hh"><div class="onum" id="dNum">1</div><div class="t"><b>طلب رقم <span id="dNum2">1</span></b><span id="dMeta"></span></div></div>
      <div id="dItems"></div>
      <div class="totrow"><span class="k">الإجمالي</span><span class="v"><span id="dTotal">0</span> دج</span></div>
      <div id="dMsg" class="dmsg err"></div>
      <button class="cta" id="payBtn" onclick="confirmPay()">تأكيد الدفع وتمرير للمطبخ</button>
      <button class="ghost" onclick="closeModal()">إغلاق</button>
    </div>
    <div class="paidmsg" id="paidMsg">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4Z"/></svg></div>
      <b>تم الدفع ✓</b>
      <span>خُصم المخزون ومُرِّر الطلب إلى شاشة المطبخ.</span>
      <button class="cta" onclick="closeModal()">تمام</button>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL='https://tflmkscxuvznpvidcgff.supabase.co';
  var SUPABASE_KEY='sb_publishable_P210ESDiwZnLYYqTu4rc3A_s5C-xHuh';
  var REST=SUPABASE_URL+'/rest/v1/';
  function H(x){ var h={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}; if(x){for(var k in x)h[k]=x[k];} return h; }
  function gGet(p){ return fetch(REST+p,{headers:H()}).then(function(r){ if(!r.ok)return r.text().then(function(t){throw new Error(t)}); return r.json(); }); }
  function gRpc(fn,b){ return fetch(REST+'rpc/'+fn,{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify(b)}).then(function(r){ if(!r.ok)return r.text().then(function(t){throw new Error(t)}); }); }

  var RID=new URLSearchParams(location.search).get('rid');
  var orders=[], cur=null;
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  function boot(){
    if(!RID){ document.getElementById('gate').style.display='block'; return; }
    document.getElementById('app').style.display='block';
    gGet('restaurants?select=restaurant_name&id=eq.'+RID).then(function(r){ if(r&&r[0]) document.getElementById('roleTag').textContent='الكاشير · '+r[0].restaurant_name; }).catch(function(){});
    loadOrders();
  }

  function loadOrders(){
    var today=iso(new Date());
    gGet('orders?select=id,order_number,total,created_at,order_items(product_name,unit_price,quantity,sauces)&restaurant_id=eq.'+RID+'&order_date=eq.'+today+'&status=eq.new&order=order_number.asc')
      .then(function(rows){ orders=rows||[]; renderList(document.getElementById('q').value.trim()); })
      .catch(function(e){ document.getElementById('list').innerHTML='<div class="empty">تعذّر التحميل: '+(e.message||e)+'</div>'; });
  }
  function timeOf(ts){ if(!ts)return ''; var d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function renderList(filter){
    document.getElementById('cnt').textContent=orders.length;
    var list=orders.filter(function(o){ return !filter || String(o.order_number).indexOf(filter)===0; });
    var el=document.getElementById('list');
    if(!orders.length){ el.innerHTML='<div class="empty">لا توجد طلبات غير مدفوعة الآن.</div>'; return; }
    el.innerHTML=list.length? list.map(function(o){
      var names=(o.order_items||[]).map(function(i){return i.product_name;}).join('، ');
      var hit=(filter && String(o.order_number)===filter)?' hit':'';
      return '<div class="ocard'+hit+'" onclick="openOrder(\''+o.id+'\')"><div class="onum">'+o.order_number+'</div>'+
        '<div class="oinfo"><b>طلب رقم '+o.order_number+'</b><span>'+(names||'—')+' · '+timeOf(o.created_at)+'</span></div>'+
        '<div class="otot">'+(o.total||0)+' دج</div></div>';
    }).join('') : '<div class="empty">لا يوجد طلب بهذا الرقم.</div>';
  }
  function filterList(){ renderList(document.getElementById('q').value.trim()); }

  function openOrder(id){
    cur=orders.find(function(o){return o.id===id;}); if(!cur)return;
    document.getElementById('dNum').textContent=cur.order_number;
    document.getElementById('dNum2').textContent=cur.order_number;
    document.getElementById('dMeta').textContent='الساعة '+timeOf(cur.created_at)+' · اليوم';
    document.getElementById('dItems').innerHTML=(cur.order_items||[]).map(function(i){
      return '<div class="li"><div class="n">'+i.product_name+' × '+i.quantity+(i.sauces?('<small>صلصات: '+i.sauces+'</small>'):'')+'</div><div class="p">'+(i.unit_price*i.quantity)+' دج</div></div>';
    }).join('');
    document.getElementById('dTotal').textContent=cur.total||0;
    document.getElementById('dMsg').className='dmsg err';
    document.getElementById('detailBody').style.display='block';
    document.getElementById('paidMsg').className='paidmsg';
    document.getElementById('modal').classList.add('show');
  }
  function confirmPay(){
    if(!cur)return;
    var btn=document.getElementById('payBtn'); btn.disabled=true; btn.textContent='جارٍ التأكيد…';
    // استدعاء الدالة: خصم المخزون + status=paid
    gRpc('pay_order', {p_order_id:cur.id})
      .then(function(){ orders=orders.filter(function(o){return o.id!==cur.id;});
        document.getElementById('detailBody').style.display='none';
        document.getElementById('paidMsg').className='paidmsg show';
        renderList(document.getElementById('q').value.trim()); })
      .catch(function(e){ document.getElementById('dMsg').textContent='تعذّر الدفع: '+(e.message||e); document.getElementById('dMsg').className='dmsg err show'; })
      .finally(function(){ btn.disabled=false; btn.textContent='تأكيد الدفع وتمرير للمطبخ'; });
  }
  function closeModal(){ document.getElementById('modal').classList.remove('show'); }

  boot();
</script>
</body>
</html>
